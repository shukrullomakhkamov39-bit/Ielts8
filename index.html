<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Rejalarim</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f7f3e9;
            --card-bg: #fffdf7;
            --text-color: #333;
            --accent-color: #5c4033;
            --border-color: #dcd0c0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }

        .nav-tabs {
            display: flex;
            overflow-x: auto;
            gap: 5px;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }

        .tab-btn {
            flex: 1;
            white-space: nowrap;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: white;
        }

        .page {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-height: 80vh;
            overflow-y: auto;
        }

        .page.active {
            display: block;
        }

        h2 {
            font-size: 18px;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 0;
            color: var(--accent-color);
        }

        .item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 5px;
        }

        .item-row input[type="text"] {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            outline: none;
        }

        .item-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .goal-block {
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
        }

        .habit-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            margin-top: 5px;
        }

        .habit-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid var(--accent-color);
            display: inline-block;
            cursor: pointer;
        }

        .habit-circle.checked {
            background-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="showTab(event, 'wishes')">✨ Xohishlar</button>
        <button class="tab-btn" onclick="showTab(event, 'goals')">🎯 Maqsadlar</button>
        <button class="tab-btn" onclick="showTab(event, 'tracker')">📅 Odatlar</button>
        <button class="tab-btn" onclick="showTab(event, 'daily')">📝 Bugun</button>
    </div>

    <!-- 1-SAHIFA: Mening xohishlarim (100 ta item scroll qilinadi) -->
    <div id="wishes" class="page active">
        <h2>Mening xohishlarim</h2>
        <div id="wishes-container"></div>
    </div>

    <!-- 2-SAHIFA: Mening oylik maqsadlarim -->
    <div id="goals" class="page">
        <h2>Mening oylik maqsadlarim</h2>
        <div class="goal-block">
            <strong>1-Maqsad:</strong>
            <input type="text" placeholder="Maqsadni kiriting..." style="width:100%; margin: 5px 0;">
            <small>Ushbu maqsadga olib boradigan odatlar:</small>
            <div class="item-row"><input type="checkbox"><input type="text" placeholder="Odat 1"></div>
            <div class="item-row"><input type="checkbox"><input type="text" placeholder="Odat 2"></div>
        </div>
        <div class="goal-block">
            <strong>2-Maqsad:</strong>
            <input type="text" placeholder="Maqsadni kiriting..." style="width:100%; margin: 5px 0;">
            <small>Ushbu maqsadga olib boradigan odatlar:</small>
            <div class="item-row"><input type="checkbox"><input type="text" placeholder="Odat 1"></div>
            <div class="item-row"><input type="checkbox"><input type="text" placeholder="Odat 2"></div>
        </div>
    </div>

    <!-- 3-SAHIFA: Odatlar kuzatuvchisi -->
    <div id="tracker" class="page">
        <h2>Odatlar kuzatuvchisi</h2>
        <div class="goal-block">
            <input type="text" placeholder="Odat nomi..." value="Ertalabki yugurish">
            <div class="habit-grid" id="habit-grid-1"></div>
        </div>
        <div class="goal-block">
            <input type="text" placeholder="Odat nomi..." value="Kitob o'qish">
            <div class="habit-grid" id="habit-grid-2"></div>
        </div>
    </div>

    <!-- 4-SAHIFA: Bugungi reja -->
    <div id="daily" class="page">
        <h2>Bugungi reja</h2>
        <p><small>Kun iqtibosi: "Har bir kun yangi imkoniyatdir."</small></p>
        <hr>
        <strong>Kun maqsadlari:</strong>
        <input type="text" placeholder="Bugungi asosiy maqsad..." style="width: 100%; margin-bottom: 10px;">
        
        <strong>Bugungi vazifalar:</strong>
        <div class="item-row"><input type="checkbox"><input type="text" placeholder="Vazifa 1"></div>
        <div class="item-row"><input type="checkbox"><input type="text" placeholder="Vazifa 2"></div>
        <div class="item-row"><input type="checkbox"><input type="text" placeholder="Vazifa 3"></div>
        
        <br>
        <strong>Boshqalarga minnatdorchilik:</strong>
        <textarea rows="3" style="width: 100%; border-color: var(--border-color);"></textarea>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        function showTab(e, tabId) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            e.currentTarget.classList.add('active');
        }

        // 100 ta xohish ro'yxati
        const wishesContainer = document.getElementById('wishes-container');
        for (let i = 1; i <= 100; i++) {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <span>${i}.</span>
                <input type="text" placeholder="Xohish ${i}...">
                <input type="checkbox">
            `;
            wishesContainer.appendChild(row);
        }

        // 30 kunlik odatlar doirachalari
        function createCircles(containerId) {
            const container = document.getElementById(containerId);
            for (let i = 1; i <= 30; i++) {
                const circle = document.createElement('div');
                circle.className = 'habit-circle';
                circle.onclick = function() {
                    this.classList.toggle('checked');
                };
                container.appendChild(circle);
            }
        }
        createCircles('habit-grid-1');
        createCircles('habit-grid-2');
    </script>
</body>
</html>
